<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190"><style>
@font-face { font-family: 'Px'; src: url(data:font/woff2;base64,) format('woff2'); }
text { font-family: 'Px', monospace; }
.crisp { shape-rendering: crispEdges; }
@keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
@keyframes bob { 0%,49% {transform:translateY(0)} 50%,100% {transform:translateY(-6px)} }
@keyframes twinkle { 0%,100% {opacity:.15} 50% {opacity:1} }
.blink { animation: blink 1s steps(1) infinite; }
.bob > g { animation: bob 1s steps(1) infinite; }

.type0, .type1 { transform-box: fill-box; transform-origin: left; }
@keyframes ty0 { 0% {transform:scaleX(0)} 30%,100% {transform:scaleX(1)} }
@keyframes ty1 { 0%,30% {transform:scaleX(0)} 70%,100% {transform:scaleX(1)} }
.type0 { animation: ty0 7s steps(33) infinite; }
.type1 { animation: ty1 7s steps(77) infinite; }
</style><defs><linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a9a"/><stop offset="1" stop-color="#120b3a"/></linearGradient></defs><rect x="8" y="30" width="984" height="152" rx="12" fill="url(#win)" stroke="#0a0820" stroke-width="10"/><rect x="8" y="30" width="984" height="152" rx="12" fill="none" stroke="#f4f0ff" stroke-width="4"/><rect x="15" y="37" width="970" height="138" rx="7" fill="none" stroke="#7a6cff" stroke-width="2" opacity=".6"/><rect x="30" y="8" width="170" height="40" rx="6" fill="#120b3a" stroke="#f4f0ff" stroke-width="3"/><text x="117" y="37" font-size="14" fill="#0a0820" text-anchor="middle" >IGNACIO</text><text x="115" y="35" font-size="14" fill="#ffd75e" text-anchor="middle" >IGNACIO</text><clipPath id="c0"><rect class="type0" x="50" y="76" width="538" height="34"/></clipPath><g clip-path="url(#c0)"><text x="52" y="102" font-size="16" fill="#0a0820" text-anchor="start" >Thanks for stopping by, traveler!</text><text x="50" y="100" font-size="16" fill="#ffffff" text-anchor="start" >Thanks for stopping by, traveler!</text></g><clipPath id="c1"><rect class="type1" x="50" y="116" width="714" height="34"/></clipPath><g clip-path="url(#c1)"><text x="52" y="142" font-size="16" fill="#0a0820" text-anchor="start" >Shall we build something legendary together?</text><text x="50" y="140" font-size="16" fill="#ffffff" text-anchor="start" >Shall we build something legendary together?</text></g><polygon class="blink crisp" points="940,158 960,158 950,170" fill="#ffffff"/></svg>